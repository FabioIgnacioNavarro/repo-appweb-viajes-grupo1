services:
  ms-tarifas:
    environment:
      RUTA_PROVEEDOR: HAVERSINE
      GEOCODIFICADOR_PROVEEDOR: ""
      PROVEEDORES_MODO: falso

  nginx:
    volumes: !override
      - ./carga/nginx.k6.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["grafana"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./carga/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_k6_data:/prometheus
    ports:
      - "${PUERTO_PROMETHEUS_HOST:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["grafana"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/k6-rendimiento.json
    volumes:
      - ./carga/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./carga/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${PUERTO_GRAFANA_HOST:-3300}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  k6:
    image: grafana/k6:0.54.0
    profiles: ["k6"]
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ./carga/k6:/scripts:ro
      - ./carga/resultados:/resultados
    environment:
      BASE_URL: http://nginx:8080
      K6_MODO: ${K6_MODO:-stress}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://prometheus:9090/api/v1/write}
      K6_PROMETHEUS_RW_USERNAME: ${K6_PROMETHEUS_RW_USERNAME:-}
      K6_PROMETHEUS_RW_PASSWORD: ${K6_PROMETHEUS_RW_PASSWORD:-}
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(95),p(99),avg,max}
      K6_PROMETHEUS_RW_PUSH_INTERVAL: ${K6_PROMETHEUS_RW_PUSH_INTERVAL:-2s}

volumes:
  prometheus_k6_data:
