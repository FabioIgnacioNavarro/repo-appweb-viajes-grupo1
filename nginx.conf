events { worker_connections 1024; }
http {
  upstream viajes { server ms-viajes:3000; }
  upstream tarifas { server ms-tarifas:3001; }
  upstream flota { server ms-flota:3002; }
  server {
    listen 8080;
    client_max_body_size 16k;
    location = /health { return 200 '{"estado":"activo","servicio":"gateway"}'; add_header Content-Type application/json; }
    location /viajes/ { proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location /estimaciones/ { proxy_pass http://tarifas; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /viajes/estimacion { proxy_pass http://tarifas; proxy_connect_timeout 1800ms; proxy_read_timeout 4s; }
    location /choferes/ { proxy_pass http://flota; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
  }
}
