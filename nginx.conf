events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_tokens:10m rate=10r/s;
  limit_req_status 429;

  map $http_upgrade $conexion_actualizacion {
    default upgrade;
    '' close;
  }

  upstream viajes { server ms-viajes:3000; }
  upstream tarifas { server ms-tarifas:3001; }
  upstream flota { server ms-flota:3002; }
  upstream auth_emulator { server auth-emulator:9099; }

  server {
    listen 8080;
    client_max_body_size 16k;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # Los hashes de style-src-attr corresponden a los estilos de iconos y altura usados por MapaLeaflet.
    # tests/e2e/gateway-config.test.ts comprueba que coincidan con el código del mapa.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-hashes' 'sha256-Klgyz7ae+9iNMNCMeX38cn5xbG4MXSNdttMqXIHGi54=' 'sha256-mXgmBfMf6ALEomri4jHbaK0yjpP3+oqxAPUylDX0/WM=' 'sha256-yOgwfe4uKtDU5TBHZmod+yfqqv/bxOHi3AVw5bMzDVM=' 'sha256-x1MR57txKbjWvNCR0fZ43Miv+H5b+c4mtPIT8xXGlPA=' 'sha256-rSBYVB477uEpqxStugCFTb2rqsbycmSJOi//MqtCBXw=' 'sha256-T4sMg9U1pcC0F3ssVo5PqMF4znv7pXED3GvEKV9vXQE='; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' ws://localhost:8080 ws://127.0.0.1:8080 wss://localhost:8080 wss://127.0.0.1:8080; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    error_page 429 = @rate_limit_json;
    location @rate_limit_json {
      default_type application/json;
      return 429 '{"error":{"codigo":"DEMASIADAS_SOLICITUDES","mensaje":"Se superó el límite razonable de solicitudes.","detalles":{}}}';
    }

    location = /health {
      default_type application/json;
      return 200 '{"estado":"activo","servicio":"gateway"}';
    }
    location = /ready/viajes { proxy_pass http://viajes/ready; }
    location = /ready/tarifas { proxy_pass http://tarifas/ready; }
    location = /ready/flota { proxy_pass http://flota/ready; }
    location = /auth/login {
      limit_req zone=auth_tokens burst=20 nodelay;
      proxy_pass http://auth_emulator;
      proxy_connect_timeout 1500ms;
      proxy_read_timeout 4s;
    }
    location ^~ /auth/ {
      limit_req zone=auth_tokens burst=20 nodelay;
      proxy_pass http://auth_emulator;
      proxy_connect_timeout 1500ms;
      proxy_read_timeout 4s;
    }

    location = /tiempo-real {
      proxy_pass http://viajes/tiempo-real;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexion_actualizacion;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location = /ws {
      proxy_pass http://viajes/tiempo-real;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexion_actualizacion;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    # Rutas internas protegidas: no accesibles desde el exterior
    location ^~ /interno/ {
      default_type application/json;
      return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"La ruta no existe o es interna.","detalles":{}}}';
    }
    location ^~ /estimaciones/ {
      default_type application/json;
      return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"La ruta no existe o es interna.","detalles":{}}}';
    }

    location /viajes/ { limit_req zone=api_general burst=60 nodelay; proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /viajes/estimacion { limit_req zone=api_general burst=60 nodelay; proxy_pass http://tarifas; proxy_connect_timeout 1800ms; proxy_read_timeout 4s; }
    location = /viajes { limit_req zone=api_general burst=60 nodelay; proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /reglas/demanda { limit_req zone=api_general burst=60 nodelay; proxy_pass http://tarifas; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /tarifas/geocodificacion-inversa { limit_req zone=api_general burst=60 nodelay; proxy_pass http://tarifas; proxy_connect_timeout 1500ms; proxy_read_timeout 5s; }
    location = /tarifas/autocompletar { limit_req zone=api_general burst=60 nodelay; proxy_pass http://tarifas; proxy_connect_timeout 1500ms; proxy_read_timeout 5s; }
    location ^~ /choferes/yo/ofertas { limit_req zone=api_general burst=60 nodelay; proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /choferes { limit_req zone=api_general burst=60 nodelay; proxy_pass http://flota; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location /choferes/ { limit_req zone=api_general burst=60 nodelay; proxy_pass http://flota; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /vehiculos { limit_req zone=api_general burst=60 nodelay; proxy_pass http://flota; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location /vehiculos/ { limit_req zone=api_general burst=60 nodelay; proxy_pass http://flota; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }

    location /assets/ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
