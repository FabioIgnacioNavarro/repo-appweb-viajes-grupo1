events { worker_connections 1024; }
http {
  map $http_upgrade $conexion_actualizacion {
    default upgrade;
    '' close;
  }
  upstream viajes { server ms-viajes:3000; }
  upstream tarifas { server ms-tarifas:3001; }
  upstream flota { server ms-flota:3002; }
  server {
    listen 8080;
    client_max_body_size 16k;

    location = /health { return 200 '{"estado":"activo","servicio":"gateway"}'; add_header Content-Type application/json; }
    location = /ready/viajes { proxy_pass http://viajes/ready; }
    location = /ready/tarifas { proxy_pass http://tarifas/ready; }
    location = /ready/flota { proxy_pass http://flota/ready; }

    location = /tiempo-real {
      proxy_pass http://viajes/tiempo-real;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexion_actualizacion;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    # Rutas internas protegidas: no accesibles desde el exterior
    location ^~ /interno/ {
      default_type application/json;
      return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"La ruta no existe o es interna.","detalles":{}}}';
    }
    location ^~ /estimaciones/ {
      default_type application/json;
      return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"La ruta no existe o es interna.","detalles":{}}}';
    }

    location /viajes/ { proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location = /viajes/estimacion { proxy_pass http://tarifas; proxy_connect_timeout 1800ms; proxy_read_timeout 4s; }
    location = /viajes { proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location ^~ /choferes/yo/ofertas { proxy_pass http://viajes; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }
    location /choferes/ { proxy_pass http://flota; proxy_connect_timeout 1500ms; proxy_read_timeout 4s; }

    location / {
      default_type application/json;
      return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"La ruta no existe.","detalles":{}}}';
    }
  }
}
