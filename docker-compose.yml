services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viajes}
      POSTGRES_USER: ${POSTGRES_USER:-viajes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viajes_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/ms-flota/schema.sql:/docker-entrypoint-initdb.d/001-ms-flota.sql:ro
      - ./src/ms-tarifas/schema.sql:/docker-entrypoint-initdb.d/002-ms-tarifas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${PUERTO_JAEGER_HOST:-16686}:16686"
    expose:
      - "4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  ms-viajes:
    build: .
    command: ["node", "dist/ms-viajes/servidor.js"]
    environment: &servicio_base
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-viajes}:${POSTGRES_PASSWORD:-viajes_dev_only}@postgres:5432/${POSTGRES_DB:-viajes}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      JWT_MODO: ${JWT_MODO:-falso}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_ROLE_CLAIM: ${JWT_ROLE_CLAIM:-rol}
      TIMEOUT_SERVICIO_MS: ${TIMEOUT_SERVICIO_MS:-1500}
      REINTENTOS_SERVICIO: ${REINTENTOS_SERVICIO:-1}
      MS_TARIFAS_URL: http://ms-tarifas:3001
      MS_VIAJES_URL: http://ms-viajes:3000
      MS_FLOTA_URL: http://ms-flota:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  ms-tarifas:
    build: .
    command: ["node", "dist/ms-tarifas/servidor.js"]
    environment:
      <<: *servicio_base
      RUTA_PROVEEDOR: ${RUTA_PROVEEDOR:-HAVERSINE}
      PROVEEDORES_MODO: ${PROVEEDORES_MODO:-falso}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TIMEOUT_PROVEEDOR_MS: ${TIMEOUT_PROVEEDOR_MS:-1800}
      PUERTO_MS_TARIFAS: 3001
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      ms-viajes:
        condition: service_started
      ms-flota:
        condition: service_started
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  ms-flota:
    build: .
    command: ["node", "dist/ms-flota/servidor.js"]
    environment:
      <<: *servicio_base
      PUERTO_MS_FLOTA: 3002
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      ms-viajes:
        condition: service_started
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUERTO_GATEWAY_HOST:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ms-viajes:
        condition: service_healthy
      ms-tarifas:
        condition: service_healthy
      ms-flota:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
